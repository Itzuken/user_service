version: '3.8'

services:
  zookeeper:
    image: wurstmeister/zookeeper:latest
    ports: ["2181:2181"]
    networks: [microservices-net]

  kafka:
    image: wurstmeister/kafka:latest
    ports: ["9092:9092"]
    environment:
      KAFKA_ADVERTISED_LISTENERS: INSIDE://kafka:9093,OUTSIDE://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INSIDE:PLAINTEXT,OUTSIDE:PLAINTEXT
      KAFKA_LISTENERS: INSIDE://0.0.0.0:9093,OUTSIDE://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: INSIDE
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CREATE_TOPICS: "user-events:1:1"
    depends_on: [zookeeper]
    networks: [microservices-net]

  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: aston_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: qwertyuiop
    ports: ["5432:5432"]
    volumes: [postgres_data:/var/lib/postgresql/data]
    networks: [microservices-net]  # Добавлено

  mailhog:
    image: mailhog/mailhog:latest
    ports: ["1025:1025", "8025:8025"]
    networks: [microservices-net]  # Добавлено

  # Новые сервисы
  discovery-server:
    build: ./discovery-server
    ports: ["8761:8761"]
    networks: [microservices-net]

  config-server:
    build: ./config-server
    ports: ["8888:8888"]
    networks: [microservices-net]
    depends_on: [discovery-server]

  api-gateway:
    build: ./api-gateway
    ports: ["8080:8080"]
    networks: [microservices-net]
    depends_on: [discovery-server]

  user-service:
    build: ./user-service
    networks: [microservices-net]
    depends_on: [discovery-server, config-server, postgres, kafka]

  notification-service:
    build: ./notification-service
    networks: [microservices-net]
    depends_on: [discovery-server, config-server, kafka, mailhog]

networks:
  microservices-net:
    driver: bridge

volumes:
  postgres_data:
